<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8751A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background rounded rectangle -->
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Inner border -->
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" fill="none" stroke="#FFF" stroke-width="2" opacity="0.3"/>
  
  <!-- TSL Text -->
  <text x="32" y="44" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="2">TSL</text>
</svg>
