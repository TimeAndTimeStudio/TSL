<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe - TSL Canvas Engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
      color: #e94560;
      z-index: 10;
    }
    canvas {
      display: block;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Tic Tac Toe - TSL Canvas Engine</h1>
  <script src="/runtime/runtime.js"></script>
  <script src="game.js"></script>
  <script>
    // === Event Handlers ===
    function handleClick(e) {
      if (game_over) return;
      
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      const col = Math.floor((x - board_x) / cell_size);
      const row = Math.floor((y - board_y) / cell_size);
      
      if (row < 0 || row > 2 || col < 0 || col > 2) return;
      
      if (get_cell(row, col) !== null) return;
      
      set_cell(row, col, current_player);
      
      const result = check_winner();
      if (result !== null) {
        winner = result;
        game_over = true;
        return;
      }
      
      if (is_board_full()) {
        game_over = true;
        return;
      }
      
      current_player = (current_player === "X") ? "O" : "X";
    }

    function handleKeyDown(e) {
      if (game_over && (e.key === 'r' || e.key === 'R')) {
        resetGame();
      }
    }

    function resetGame() {
      board = [null, null, null, null, null, null, null, null, null];
      current_player = "X";
      game_over = false;
      winner = null;
    }

    // === Initialize ===
    initCanvas(800, 600);
    canvas.addEventListener('click', handleClick);
    document.addEventListener('keydown', handleKeyDown);
    
    // Run the game loop
    run({ update, draw });
  </script>
</body>
</html>
